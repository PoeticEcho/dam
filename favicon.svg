<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162834"/>
      <stop offset="100%" stop-color="#0d171e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9beeff"/>
      <stop offset="55%" stop-color="#75d4e8"/>
      <stop offset="100%" stop-color="#a9dac4"/>
    </linearGradient>
    <linearGradient id="dam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#607b85"/>
      <stop offset="100%" stop-color="#2c414a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#527882" stroke-width="2"/>
  <!-- Dam piers / crest at top -->
  <path d="M12 16 H52 V21 H45 V26 H39 V21 H25 V26 H19 V21 H12 Z" fill="url(#dam)"/>
  <rect x="12" y="14" width="40" height="2.5" rx="1.25" fill="#75d4e8" opacity="0.85"/>
  <!-- Three flowing water waves (≋ motif) -->
  <path d="M13 31 C19 26, 25 26, 32 31 C39 36, 45 36, 51 31" fill="none" stroke="url(#water)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M13 40 C19 35, 25 35, 32 40 C39 45, 45 45, 51 40" fill="none" stroke="url(#water)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M13 49 C19 44, 25 44, 32 49 C39 54, 45 54, 51 49" fill="none" stroke="#a9dac4" stroke-width="4.2" stroke-linecap="round"/>
</svg>
